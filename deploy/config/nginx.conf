worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # OpenShift compatibility - use /tmp for all runtime directories
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/nginx_access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/x-javascript 
               application/xml+rss application/rss+xml font/truetype 
               font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_buffering off;
    proxy_http_version 1.1;

    # DNS resolver for runtime name resolution.
    # ${DNS_RESOLVER} is filled in at container startup from the pod's
    # /etc/resolv.conf (see docker-entrypoint.sh). We resolve backend
    # hostnames on each request (not at startup) so nginx can boot even
    # if the backend / cluster DNS is not ready yet.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8090;
        server_name _;
        
        root /home/geostudio/srv;
        index index.html;

        # Custom 404 error page
        error_page 404 /404.html;
        location = /404.html {
            root /home/geostudio/errors;
            internal;
        }

        # Security headers for all responses
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve env.json from hardcoded location
        location = /env.json {
            alias /home/geostudio/env.json;
            add_header Content-Type "application/json";
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Studio Gateway API proxy (v2)
        location /studio-gateway/v2/ {
            # Put the backend address in a variable so nginx resolves it
            # per-request via the resolver above, instead of at startup.
            set $studio_gateway "${STUDIO_GATEWAY_API_URL}";
            # Strip the "/studio-gateway" prefix before forwarding.
            # e.g. /studio-gateway/v2/foo  ->  /v2/foo
            rewrite ^/studio-gateway(/.*)$ $1 break;
            proxy_pass https://$studio_gateway;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *; img-src data: blob: *; worker-src 'self' data: blob:; frame-ancestors 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Studio Gateway API proxy
        location /studio-gateway/ {
            set $studio_gateway "${STUDIO_GATEWAY_API_URL}";
            # /studio-gateway/foo  ->  /foo
            rewrite ^/studio-gateway/(.*)$ /$1 break;
            proxy_pass https://$studio_gateway;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *; img-src data: blob: *; worker-src 'self' data: blob:; frame-ancestors 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Geoserver proxy
        location /geofm-geoserver/ {
            set $geofm_geoserver "${GEOFM_GEOSERVER}";
            # /geofm-geoserver/foo  ->  /foo
            rewrite ^/geofm-geoserver/(.*)$ /$1 break;
            proxy_pass http://$geofm_geoserver;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *; img-src data: blob: *; worker-src 'self' data: blob:; frame-ancestors 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "max-age=43200" always;
        }

        # MLflow proxy - deny most ajax-api endpoints
        location ~ ^/mlflow/ajax-api/(?!2\.0/mlflow/(runs/get|model-versions/search|experiments/get|metrics/get-history-bulk-interval|metrics/get-history|traces|artifacts/list)) {
            return 403;
        }

        # MLflow proxy - allowed endpoints
        location /mlflow/ {
            set $mlflow "${MLFLOW_URL}";
            # /mlflow/foo  ->  /foo
            rewrite ^/mlflow/(.*)$ /$1 break;
            proxy_pass http://$mlflow;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";
            
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src *; img-src data: blob: *; worker-src 'self' data: blob:; frame-ancestors 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Static file serving with SPA fallback
        location / {
            # Try to serve the file, if it doesn't exist:
            # - For paths with file extensions (like .js, .css): return 404
            # - For paths without extensions (SPA routes): serve index.html
            try_files $uri $uri/ @index_fallback;
            
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' https://dev.virtualearth.net blob:; connect-src *; img-src data: blob: *; worker-src 'self' data: blob:; frame-ancestors 'self';" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
        
        # Fallback handler - only serve index.html for paths without file extensions
        location @index_fallback {
            # If URI contains a dot (file extension), return 404
            # Otherwise serve index.html for SPA routing
            if ($uri ~ \.) {
                return 404;
            }
            rewrite ^ /index.html last;
        }
    }
}
